services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplekitchen_admin}
      POSTGRES_USER: ${POSTGRES_USER:-simplekitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/London
    volumes:
      - simplekitchen_admin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: Europe/London
      DEPLOYMENT_PLATFORM: Plesk / Docker
      APP_SERVICE_NAME: Simple Kitchen Admin
      DATABASE_URL: postgresql://${POSTGRES_USER:-simplekitchen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simplekitchen_admin}
    ports:
      - "127.0.0.1:${APP_PORT:-8093}:5000"
    networks:
      - internal

volumes:
  simplekitchen_admin_pgdata:

networks:
  internal:
    driver: bridge
